<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>CP BAR · Caja</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F4F2EE">
<script>
  // Tema antes de pintar nada (sin parpadeo). Por defecto, claro.
  try { if (localStorage.getItem('cpbar.tema') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { /* sin almacenamiento */ }
</script>
<link rel="stylesheet" href="app.css">
<script type="module" src="boot.js"></script>
</head>
<body>
<div class="layout">
  <nav class="side" aria-label="Menú principal">
    <div class="brand"><span class="brand-mark">CP</span>CP BAR</div>
    <div id="nav" class="nav"></div>
    <div class="grow"></div>
    <div id="admin-state"></div>
    <div id="shift-info" class="shift-info"></div>
    <div class="side-foot">
      <div id="clock" class="clock" aria-live="off"></div>
      <button id="theme-btn" class="theme-btn" type="button" aria-label="Cambiar entre tema claro y oscuro"></button>
    </div>
  </nav>
  <div class="content">
    <div id="banners"></div>
    <main id="main" class="main"></main>
  </div>
</div>
<div id="boot" style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;text-align:center;padding:24px">
  <div style="display:flex;align-items:center;gap:12px;font-size:36px;font-weight:800">
    <span style="width:54px;height:54px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:900">CP</span>CP BAR
  </div>
  <div style="width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:cpbar-spin 1s linear infinite"></div>
  <p id="boot-text" style="font-size:20px;max-width:560px;margin:0">Arrancando la caja…</p>
  <p style="font-size:15px;color:var(--muted);margin:0">La primera vez tarda un poco más. Después funciona sin internet.</p>
  <style>@keyframes cpbar-spin{to{transform:rotate(360deg)}} #boot.boot-error #boot-text{color:var(--danger-text)}</style>
</div>
<div id="overlays"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
</body>
</html>
